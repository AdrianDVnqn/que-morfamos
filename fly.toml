app = "que-morfamos-api-black-paper-1056"
primary_region = "ewr"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "get"
    path = "/health"
    timeout = "10s"

[[vm]]
  memory_mb = 768
  cpu_kind = "shared"
  cpus = 2
