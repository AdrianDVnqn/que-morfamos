app = "que-morfamos-api-black-paper-1056"
primary_region = "gru"  # <--- CAMBIADO de 'gru' a 'eze' (Buenos Aires)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "60s"   # <--- Aumentado a 60s por las dudas (Pandas es pesado)
    interval = "15s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1